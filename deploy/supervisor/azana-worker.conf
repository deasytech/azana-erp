; The queue worker: sends notifications and runs backups requested from the screen.
; Install: copy to /etc/supervisor/conf.d/, then `supervisorctl reread && supervisorctl update`.
; Needs DB_QUEUE_RETRY_AFTER=3700 in .env (longer than --timeout), or a running backup is handed to a second worker.
; The deploy script runs `php artisan queue:restart`, which makes these workers pick up new code on their own.
[program:azana-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/azana-erp/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=3600
directory=/var/www/azana-erp
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/azana-erp/storage/logs/worker.log
