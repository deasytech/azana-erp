; Install as /etc/php/8.3/fpm/conf.d/99-azana.ini (and the same in /etc/php/8.3/cli/conf.d/ for artisan), then restart php8.3-fpm.
; Limits that match nginx (client_max_body_size 12M) and the 10 MB import files in docs/DATA_IMPORT.md. PHP's defaults (2 MB) would reject them.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On

; Opcache keeps compiled code in memory. Timestamps are still checked (see below) so a deployment is picked up without restarting PHP.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1   ; a deployment is picked up within revalidate_freq seconds, with no PHP-FPM reload (and so no sudo) in deploy.sh
opcache.revalidate_freq = 10

session.cookie_secure = 1
session.cookie_httponly = 1
