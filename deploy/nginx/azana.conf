# One Laravel application, four public names (docs/ARCHITECTURE.md, docs/deployment/HOSTINGER_VPS_GUIDE.md):
#
#   azanafarms.com        -> redirected to https://www.azanafarms.com   (the website's single, canonical address)
#   www.azanafarms.com    -> the public website
#   erp.azanafarms.com    -> the management application (Filament)
#   api.azanafarms.com    -> the mobile API only (/api/v1) plus its reference (/docs) and the health check
#
# The application decides which pages each host serves (WEBSITE_HOST / ERP_HOST in .env). This file adds the second line of defence:
# the API and its reference are not reachable on the website or the ERP, and the API host serves nothing else.
#
# Two certificates, so the ERP and API can go live (new names, no risk to the old website) before the website's DNS moves:
#   erp.azanafarms.com  covers erp + api            -> /etc/letsencrypt/live/erp.azanafarms.com/
#   azanafarms.com      covers the apex and www     -> /etc/letsencrypt/live/azanafarms.com/
# Not syntax-checked by the author (nginx was not installed on the machine this was written on): run `nginx -t` before reloading.

# ---- http: certbot's challenge, then everything to https --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name azanafarms.com www.azanafarms.com erp.azanafarms.com api.azanafarms.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- the bare domain: one address for the website ------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # "http2 on;" needs nginx 1.25.1+; Ubuntu 24.04 ships 1.24.0, which would refuse it. This form works on both (newer versions only warn).

    server_name azanafarms.com;

    ssl_certificate     /etc/letsencrypt/live/azanafarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azanafarms.com/privkey.pem;

    return 301 https://www.azanafarms.com$request_uri;
}

# ---- shared by the three application servers below ----------------------------------------------------------------------------------
# (nginx has no way to share a block between servers except include; keeping each server complete avoids a second file to lose.)

# ---- www: the public website ---------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.azanafarms.com;

    ssl_certificate     /etc/letsencrypt/live/azanafarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azanafarms.com/privkey.pem;

    root /var/www/azana-erp/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API and its reference belong to api.azanafarms.com only.
    location ^~ /api/ { return 404; }
    location = /docs  { return 404; }

    include /etc/nginx/snippets/azana-app.conf;
}

# ---- erp: the management application -------------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name erp.azanafarms.com;

    ssl_certificate     /etc/letsencrypt/live/erp.azanafarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.azanafarms.com/privkey.pem;

    root /var/www/azana-erp/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12M;   # import files (10 MB) and photos
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /api/ { return 404; }
    location = /docs  { return 404; }

    include /etc/nginx/snippets/azana-app.conf;
}

# ---- api: the mobile API and nothing else --------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.azanafarms.com;

    ssl_certificate     /etc/letsencrypt/live/erp.azanafarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.azanafarms.com/privkey.pem;

    root /var/www/azana-erp/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2M;    # sync batches are JSON; photos are not sent through the API
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Allow-list: the API, its reference, and the two health routes. Every other path (the ERP, the website, /livewire, /storage) is 404 here.
    location ^~ /api/v1/ { rewrite ^ /index.php last; }
    location = /docs      { rewrite ^ /index.php last; }
    location = /health    { rewrite ^ /index.php last; }
    location = /up        { rewrite ^ /index.php last; }
    location ~ ^/(js|css|build|fonts|images)/ { try_files $uri =404; expires 7d; }   # what /docs itself loads
    location = /favicon.ico { try_files $uri =404; }

    location = /index.php {
        include /etc/nginx/snippets/azana-php.conf;
    }

    location / { return 404; }
}
