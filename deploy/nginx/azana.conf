# One application, two public addresses (docs/ARCHITECTURE.md): www = the public website, erp = the management application.
# Certificates: `certbot --nginx -d www.azanafarms.com -d azanafarms.com -d erp.azanafarms.com`.
# The application itself decides which pages each host serves (WEBSITE_HOST / ERP_HOST in .env).
server {
    listen 80;
    server_name azanafarms.com www.azanafarms.com erp.azanafarms.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.azanafarms.com erp.azanafarms.com;

    ssl_certificate     /etc/letsencrypt/live/www.azanafarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.azanafarms.com/privkey.pem;

    root /var/www/azana-erp/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12M;   # import files and photos

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /health { try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing but the public folder is served; dotfiles never are.
    location ~ /\.(?!well-known).* { deny all; }
}
