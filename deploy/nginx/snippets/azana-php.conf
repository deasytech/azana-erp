# Install as /etc/nginx/snippets/azana-php.conf. Hands a request to PHP-FPM.
fastcgi_pass unix:/run/php/php8.3-fpm.sock;
fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;     # always the front controller, whatever the URL says
include fastcgi_params;
fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 120s;                                    # the longest reports; backups and imports run on the queue, not here
