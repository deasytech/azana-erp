# Included by the www and erp servers in azana.conf. Install as /etc/nginx/snippets/azana-app.conf.
# Static files and Laravel's front controller; nothing but the public folder is ever served.

# "/index.php/anything" would otherwise reach Laravel with the prefix stripped and slip past the /api and /docs blocks of the server.
# Must come before the \.php$ rule; the internal redirect to plain /index.php is unaffected.
location ~ ^/index\.php/ { return 404; }

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /health { try_files $uri /index.php?$query_string; }

# Built assets never change under the same name: cache them hard.
location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~ \.php$ {
    include /etc/nginx/snippets/azana-php.conf;
}

# Dotfiles are never served (certbot's folder is on a different server block).
location ~ /\.(?!well-known).* { deny all; }

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
gzip_min_length 1024;
