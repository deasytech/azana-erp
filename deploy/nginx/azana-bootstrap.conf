# STEP 1 of the HTTPS set-up: port 80 only, so certbot can prove the names are ours before any certificate exists.
# (azana.conf refers to certificate files that do not exist yet, so nginx would refuse to start with it.)
# Use it, get the certificates (docs/deployment/HOSTINGER_VPS_GUIDE.md, section 7), then replace it with azana.conf.
# Replace every name only if the domain is not azanafarms.com. Remove this file afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name azanafarms.com www.azanafarms.com erp.azanafarms.com api.azanafarms.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
